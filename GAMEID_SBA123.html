<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <style>
        body {
            background-color: #202124;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .search-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        .logo {
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }
        .g { color: #4285F4; } .o1 { color: #EA4335; } .o2 { color: #FBBC05; }
        .g2 { color: #4285F4; } .l { color: #34A853; } .e { color: #EA4335; }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            border-radius: 24px;
            border: 1px solid #5f6368;
            background-color: #303134;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .search-box:focus {
            background-color: #3c4043;
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
        }
        .buttons { margin-top: 25px; }
        .btn {
            background-color: #303134;
            border: 1px solid #303134;
            color: #e8eaed;
            font-size: 14px;
            margin: 5px;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover { border: 1px solid #5f6368; }

        /* Contenedor del Navegador Desbloqueado */
        #browser-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            z-index: 9999;
        }
        /* Barra de herramientas del navegador interno */
        .browser-bar {
            width: 100%;
            height: 40px;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }
        .close-btn {
            background: #ff5f56;
            border: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            cursor: pointer;
            margin-right: 15px;
        }
        iframe {
            width: 100%;
            height: calc(100vh - 40px);
            border: none;
        }
    </style>
</head>
<body>

    <div class="search-container" id="main-search">
        <div class="logo">
            <span class="g">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
        </div>
        <input type="text" id="search-input" class="search-box" placeholder="Busca en Google o escribe una URL (ej: poki.com)..." autofocus>
        <div class="buttons">
            <button class="btn" onclick="launchProxy()">Buscar con Google</button>
            <button class="btn" onclick="launchProxy()">Voy a tener suerte</button>
        </div>
    </div>

    <div id="browser-container">
        <div class="browser-bar">
            <button class="close-btn" title="Cerrar Navegador" onclick="closeBrowser()"></button>
            <span style="color: #aaa; font-size: 12px;">Navegación Protegida Suphaler Activa</span>
        </div>
        <iframe id="viewport" allow="fullscreen; gamepad; clipboard-read; clipboard-write; microphone; camera;"></iframe>
    </div>

    <script>
        const searchInput = document.getElementById('search-input');
        
        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') launchProxy();
        });

        function launchProxy() {
            let query = searchInput.value.trim();
            if (!query) return;

            let targetUrl = "";
            const isUrl = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i.test(query);

            if (isUrl) {
                targetUrl = query;
                if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                    targetUrl = 'https://' + targetUrl;
                }
            } else {
                // Si busca palabras, lo mandamos a un clon limpio de DuckDuckGo/Google
                targetUrl = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(query);
            }

            // PASO CLAVE: Usamos el puente público de AllOrigins para saltar el bloqueo de iFrame corporativo/escolar
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

            // Abrir el navegador virtual a pantalla completa
            document.getElementById('main-search').style.display = 'none';
            document.getElementById('browser-container').style.display = 'block';
            document.getElementById('viewport').src = proxyUrl;
        }

        function closeBrowser() {
            document.getElementById('browser-container').style.display = 'none';
            document.getElementById('main-search').style.display = 'flex';
            document.getElementById('viewport').src = 'about:blank';
        }
    </script>

</body>
</html>
