<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario 64 - BLJ Edition</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #game-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Servidor de emulación estático sin anuncios ni bloqueos de iframe -->
        <iframe 
            src="https://images-opensocial.googleusercontent.com/gadgets/ifr?url=https://cdn.jsdelivr.net/gh/gamedistribution/gamedistribution-gamerepository@master/SuperMario64/index.xml&container=ig" 
            allow="gamepad; autoplay" 
            sandbox="allow-scripts allow-same-origin allow-forms"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
